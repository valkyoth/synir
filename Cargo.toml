[workspace]
members = ["crates/synir", "crates/synir-core", "crates/synir-host", "crates/synir-macros", "tools/xtask"]
default-members = ["crates/synir"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/valkyoth/synir"
homepage = "https://github.com/valkyoth/synir"

[workspace.dependencies]
synir-core = { path = "crates/synir-core", version = "=0.1.0", default-features = false }
synir-host = { path = "crates/synir-host", version = "=0.1.0", default-features = false }
synir-macros = { path = "crates/synir-macros", version = "=0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
unused_must_use = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
overflow-checks = true
