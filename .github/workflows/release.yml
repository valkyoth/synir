name: Release Metadata Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show
      - run: scripts/checks.sh
      - run: cargo xtask freshness
      # Pentest, exact-candidate evidence and authorization follow the runbook.
      # This workflow does not tag or publish packages.
