# Adapted from eth/brynja; no third-party dependencies are admitted.
# cargo xtask policy enforces first-party package identity and paths too.
[graph]
all-features = true

[licenses]
confidence-threshold = 0.95
include-dev = true
include-build = true
allow = ["MIT", "Apache-2.0"]
unused-allowed-license = "allow"
unused-license-exception = "deny"

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"

[advisories]
db-path = ".cargo-deny-advisory-dbs"
yanked = "deny"
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = []
allow-git = []
